<!DOCTYPE html>
<html>
<head>
    <title>Agregar Accesorio</title>
</head>
<body>
    <header>
        <h1>Tienda de Fucho</h1>
        <nav>
            <a href="index.php">Inicio</a>
            <a href="accesorios.php">Catálogo</a>
            <a href="contacto.php">Contacto</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Agregar Producto</h2>

            <form action="#" method="post">
                <fieldset>
                    <legend>Información general</legend>

                    <label for="nom">Nombre del accesorio:</label>
                    <input type="text" id="nom" name="nombre" required>
                    <br>

                    <label for="cat">Categoría:</label>
                    <select id="cat" name="categoria" required>
                        <option value="">Seleccione...</option>
                        <option value="playeras">Playeras</option>
                        <option value="balones">Balones</option>
                        <option value="tenis">Tenis</option>
                    </select>
                    <br>

                    <label for="prec">Precio:</label>
                    <input type="number" id="prec" name="precio" min="0" required>
                    <br>

                    <label for="stk">Stock:</label>
                    <input type="number" id="stk" name="stock" min="0">
                    <br>

                    <label for="fec">Fecha de alta:</label>
                    <input type="date" id="fec" name="fecha">
                    <br>

                    <label for="img">URL Imagen:</label>
                    <input type="url" id="img" name="imagen">
                    <br>

                    <label for="obs">Observaciones:</label>
                    <textarea id="obs" name="observaciones" rows="3"></textarea>
                    <br>

                    <button type="submit">Guardar</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; Cristian Pérez</p>
    </footer>
</body>
</html>
